<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Grammar Practice</title><style>
:root{--p:#6d3df5;--bg:#f6f5fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#202030}.wrap{max-width:1150px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#31127f,#6d3df5);color:white;padding:24px;border-radius:22px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:bold}.tab{background:white;border:1px solid #ddd6f5}.tab.active,.primary{background:var(--p);color:white}.grid{display:grid;grid-template-columns:1.5fr .7fr;gap:16px}.card{background:white;padding:18px;border-radius:18px;border:1px solid #e8e4f2}.question{font-size:20px;line-height:1.55;margin:14px 0}.opt{border:1px solid #ddd;padding:12px;border-radius:12px;margin:8px 0;cursor:pointer}.opt.sel{border-color:var(--p);background:#f5f1ff}textarea{width:100%;min-height:100px;padding:12px;border-radius:12px;border:1px solid #ddd}.result,.hint,.solution{padding:13px;border-radius:12px;margin:12px 0}.result{background:#eefaf3}.hint{background:#f7f4ff}.solution{background:#fff7e3}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class='wrap'><div class='hero'><h1>🧠 Grammar Practice</h1><p>Learn → Hint → Practice → Challenge → Review</p></div><div id='tabs' class='tabs'></div><div class='grid'><main><div id='result' class='result hidden'></div><div class='card'><b id='topic'></b><div id='question' class='question'></div><div id='work'></div><div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:15px'><button id='hintBtn'>💡 Hint</button><button id='prev'>← Previous</button><button id='finish' class='primary'>Finish & Score</button><button id='next'>Next →</button></div><div id='hint' class='hint hidden'></div><div id='solution' class='solution hidden'></div></div></main><aside><div class='card'><h3>📘 Best Method</h3><p>1. Try without help</p><p>2. Use hint only when needed</p><p>3. Check explanation</p><p>4. Repeat weak topics</p></div></aside></div></div><script>
const API_URL='https://script.google.com/macros/s/AKfycby93OqAVZly8hOur-nq1mxZ2rKWS1Aif4sSrlbz8Y2Ot4b8Y_RFbvWqSn-_D--GsDZ-/exec';
const tasks=["Grammar - Parts of Speech", "Grammar - Tenses", "Grammar - Subject Verb Agreement", "Grammar - Articles", "Grammar - Prepositions", "Grammar - Sentence Structure", "Grammar - Error Identification", "Grammar - Sentence Correction", "Grammar - Active Passive", "Grammar - Reported Speech", "Grammar - Conditionals", "Grammar - Linking Words", "Grammar - Mixed Challenge"];let task=tasks[0],rows=[],i=0,choice=-1;const $=x=>document.getElementById(x);
async function load(t){task=t;i=0;choice=-1;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));let r=await fetch(API_URL+'?action=getQuestions&task='+encodeURIComponent(t)+'&t='+Date.now());let j=await r.json();rows=j.questions||j||[];render()}
function render(){let q=rows[i]||{};choice=-1;$('result').className='result hidden';$('solution').className='solution hidden';$('hint').className='hint hidden';$('topic').textContent=task.replace('Grammar - ','');$('question').textContent=q.question||q.text||'';let opts=String(q.options||'').split('|').filter(Boolean);if(task.includes('Sentence Correction')){$('work').innerHTML='<textarea id="free" placeholder="Write the corrected sentence..."></textarea>'}else{$('work').innerHTML=opts.map((o,n)=>'<div class="opt" data-n="'+n+'">'+o+'</div>').join('');document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{choice=+x.dataset.n;document.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));x.classList.add('sel')})}$('hint').textContent=q.explanation||'Read the grammar pattern carefully.'}
$('finish').onclick=()=>{let q=rows[i]||{},u='';if(task.includes('Sentence Correction'))u=$('free').value;else u=(String(q.options||'').split('|')[choice]||'');let ok=norm(u)===norm(q.answer);$('result').className='result';$('result').innerHTML=ok?'🎉 <b>Correct!</b> Excellent work.':'📘 <b>Review the rule.</b>';$('solution').className='solution';$('solution').innerHTML='<b>Answer:</b> '+(q.answer||'')+'<br><br><b>Explanation:</b> '+(q.explanation||'')};
$('hintBtn').onclick=()=>$('hint').classList.toggle('hidden');$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<rows.length-1){i++;render()}};
function norm(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}tasks.forEach(t=>{let b=document.createElement('button');b.className='tab';b.dataset.t=t;b.textContent=t.replace('Grammar - ','');b.onclick=()=>load(t);$('tabs').appendChild(b)});load(task);
</script></body></html>
