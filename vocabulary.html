<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Learning</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172238;--muted:#66758b;--line:#e2e7f0;--p:#5637d8;--p2:#7846ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center}.dashboard,.pageBtn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 17px;font-weight:850;color:#334155}.page{max-width:1450px;margin:auto;padding:22px 28px}.hero{background:linear-gradient(125deg,#2b1a6b,#5631bf 56%,#8048ed);color:#fff;border-radius:25px;padding:28px}.hero h1{margin:0;font-size:30px}.hero p{margin:9px 0 0;opacity:.9}.tabs{display:flex;gap:9px;overflow-x:auto;padding:18px 2px}.tab{white-space:nowrap;border:1px solid #ded8f3;background:#fff;border-radius:13px;padding:11px 15px;font-size:13px;font-weight:850}.tab.active,.primary{color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent}.control{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:84px;z-index:10}.topicTitle{font-weight:950;font-size:16px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px}.btn{border:0;border-radius:13px;padding:11px 16px;font-size:13px;font-weight:900}.stop{color:#a42636;background:#fff1f2;border:1px solid #f1c3ca}.hidden{display:none!important}.list{margin-top:18px;display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;transition:.3s}.card.active{border-color:#8f7af0;background:#faf8ff;box-shadow:0 0 0 4px #6745e412}.cardHead{display:flex;justify-content:space-between}.number{font-size:11px;font-weight:950;color:#6d5aca}.wordRow{display:flex;align-items:center;gap:12px;margin-top:6px}.word{font-size:28px;font-weight:950}.pos,.badge{font-size:12px;padding:7px 10px;background:#eef1f6;border-radius:20px;color:#536174;font-weight:800}.iconBtn,.listenSmall{border:1px solid #ddd8f4;background:#fff;color:#5637d8;border-radius:11px;padding:9px 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.block{border-radius:17px;padding:16px;background:#f8fafc;border:1px solid #e9edf3}.label{font-size:11px;font-weight:950;letter-spacing:.08em;color:#738096;margin-bottom:8px}.sentence{font-size:17px;line-height:1.6}.telugu{font-family:"Noto Sans Telugu","Nirmala UI","Gautami",sans-serif;font-size:18px;line-height:1.7}.blockTop{display:flex;justify-content:space-between;gap:10px}.footer{display:flex;justify-content:space-between;margin-top:16px}.resource{display:inline-flex;text-decoration:none;border:1px solid #ddd8f4;color:#4c32b0;background:#fff;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:850}.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.empty,.error{padding:35px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px}.error{background:#fff1f2;color:#a42636}.status{font-size:12px;font-weight:900;padding:8px 11px;border-radius:20px;background:#f0f2f6}@media(max-width:800px){.grid{grid-template-columns:1fr}.control{position:static;flex-direction:column;align-items:flex-start}.top{padding:0 15px}.page{padding:16px}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">V</div><span>Vocabulary Learning</span></div><button class="dashboard" onclick="location.href='index.html'">← Dashboard</button></header>
<main class="page"><section class="hero"><h1>Build Vocabulary. Hear It. Understand It. Remember It.</h1><p>10 words per page • Indian English + Telugu voice preference • automatic guided learning</p></section><div id="tabs" class="tabs"></div>
<section class="control"><div><div id="topicTitle" class="topicTitle">Vocabulary</div><div id="topicSub" class="sub">Loading words...</div></div><div class="actions"><span id="status" class="status">Ready</span><button id="startBtn" class="btn primary">▶ Start Auto Learning</button><button id="stopBtn" class="btn stop hidden">■ Stop</button></div></section>
<section id="list" class="list"></section><div class="pagination"><button id="prevPage" class="pageBtn">← Previous 10</button><strong id="pageInfo">Page 1</strong><button id="nextPage" class="pageBtn">Next 10 →</button></div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycby93OqAVZly8hOur-nq1mxZ2rKWS1Aif4sSrlbz8Y2Ot4b8Y_RFbvWqSn-_D--GsDZ-/exec',PAGE_SIZE=10;
const TOPICS=[['vocabularyDailyUse','Daily Use'],['vocabularyAcademic','Academic'],['vocabularyPteHighFrequency','PTE High-Frequency'],['vocabularySynonymsAntonyms','Synonyms & Antonyms'],['vocabularyBusinessWork','Business & Work'],['vocabularyEducation','Education'],['vocabularyScienceTechnology','Science & Technology'],['vocabularyEnvironment','Environment'],['vocabularyHealthLifestyle','Health & Lifestyle'],['vocabularyTravelSociety','Travel & Society'],['vocabularyAdvanced','Advanced'],['vocabularyConfusingWords','Confusing Words']];
let currentTopic=TOPICS[0][0],words=[],page=0,stopRequested=false,voices=[];const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function loadVoices(){voices=speechSynthesis.getVoices()||[]}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function jsonp(action){return new Promise((resolve,reject)=>{const cb='pteVocab_'+Date.now()+'_'+Math.floor(Math.random()*99999),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(new Error('Backend timeout'))},15000);function clean(){clearTimeout(t);s.remove();try{delete window[cb]}catch(e){}}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('Backend connection failed'))};s.src=API_URL+'?action='+encodeURIComponent(action)+'&callback='+encodeURIComponent(cb)+'&t='+Date.now();document.body.appendChild(s)})}
function tabs(){const e=$('tabs');e.innerHTML='';TOPICS.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(k===currentTopic?' active':'');b.textContent=l;b.onclick=()=>loadTopic(k);e.appendChild(b)})}
async function loadTopic(k){stopAuto();currentTopic=k;page=0;tabs();$('list').innerHTML='<div class="empty">Loading vocabulary...</div>';try{const d=await jsonp(k);if(d.ok===false)throw new Error(d.error);words=(d.questions||[]).filter(x=>String(x.word||x.question||'').trim());render()}catch(e){$('list').innerHTML='<div class="error"><b>Unable to load Vocabulary.</b><br>'+esc(e.message)+'<br><br>Update Code.gs and redeploy.</div>'}}
function items(){return words.slice(page*PAGE_SIZE,page*PAGE_SIZE+PAGE_SIZE)}
function render(){const label=TOPICS.find(x=>x[0]===currentTopic)[1];$('topicTitle').textContent=label+' Vocabulary';$('topicSub').textContent=words.length?words.length+' words available • 10 words per page':'No words found';const a=items();if(!a.length){$('list').innerHTML='<div class="empty">No vocabulary found. Required columns: Word, Example Sentence, Telugu Word Meaning, Telugu Sentence Meaning.</div>';updatePage();return}$('list').innerHTML=a.map((x,i)=>{let n=page*10+i+1,w=x.word||x.question||'',s=x.exampleSentence||x.sentence||x.text||'',tw=x.teluguWordMeaning||x.teluguMeaning||'',ts=x.teluguSentenceMeaning||x.teluguSentence||'',pos=x.partOfSpeech||'Vocabulary',r=String(x.resourceUrl||x.resource||'').trim();return `<article id="card-${i}" class="card"><div class="cardHead"><div><div class="number">WORD ${String(n).padStart(2,'0')}</div><div class="wordRow"><div class="word">${esc(w)}</div><span class="pos">${esc(pos)}</span><button class="iconBtn" onclick="speakNow(${i},'word')">🔊</button></div></div><span id="badge-${i}" class="badge">Ready</span></div><div class="grid"><div class="block"><div class="blockTop"><div class="label">EXAMPLE SENTENCE</div><button class="listenSmall" onclick="speakNow(${i},'sentence')">🔊 Listen</button></div><div class="sentence">${esc(s)}</div></div><div class="block"><div class="label">TELUGU WORD MEANING</div><div class="telugu">${esc(tw)}</div></div><div class="block"><div class="blockTop"><div class="label">TELUGU SENTENCE MEANING</div><button class="listenSmall" onclick="speakNow(${i},'telugu')">🔊 వినండి</button></div><div class="telugu">${esc(ts)}</div></div><div class="block"><div class="label">LEARNING FLOW</div><div class="sub">Word → 3 sec → Sentence → 3 sec → Telugu meaning → Next word</div></div></div><div class="footer"><button class="btn" onclick="startFrom(${i})">▶ Start From This Card</button>${r?`<a class="resource" href="${attr(r)}" target="_blank">🔗 Open Resource ↗</a>`:''}</div></article>`}).join('');updatePage()}
function updatePage(){let pages=Math.max(1,Math.ceil(words.length/10));$('pageInfo').textContent='Page '+(page+1)+' of '+pages;$('prevPage').disabled=page===0;$('nextPage').disabled=page>=pages-1}
function pick(lang){let p=lang==='te'?'te':'en';return voices.find(v=>v.lang.toLowerCase()===(lang==='te'?'te-in':'en-in'))||voices.find(v=>v.lang.toLowerCase().startsWith(p))||null}
function speak(text,lang){return new Promise(resolve=>{if(!text||!String(text).trim()||!('speechSynthesis'in window)){resolve();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(text));u.lang=lang==='te'?'te-IN':'en-IN';let v=pick(lang);if(v)u.voice=v;u.rate=lang==='te'?.88:.92;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
function speakNow(i,t){let x=items()[i];if(t==='word')speak(x.word||x.question||'','en');if(t==='sentence')speak(x.exampleSentence||x.sentence||x.text||'','en');if(t==='telugu')speak(x.teluguSentenceMeaning||x.teluguSentence||'','te')}
function active(i){document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));document.querySelectorAll('.badge').forEach(b=>b.textContent='Ready');let c=$('card-'+i),b=$('badge-'+i);c.classList.add('active');b.textContent='▶ Learning';c.scrollIntoView({behavior:'smooth',block:'center'})}
async function run(start=0){stopRequested=false;$('startBtn').classList.add('hidden');$('stopBtn').classList.remove('hidden');$('status').textContent='Auto learning';for(let i=start;i<items().length;i++){if(stopRequested)break;active(i);let x=items()[i];await speak(x.word||x.question||'','en');if(stopRequested)break;await sleep(3000);await speak(x.exampleSentence||x.sentence||x.text||'','en');if(stopRequested)break;await sleep(3000);await speak(x.teluguSentenceMeaning||x.teluguSentence||'','te');if(stopRequested)break;await sleep(1200)}if(!stopRequested&&page<Math.ceil(words.length/10)-1){page++;render();await sleep(500);return run(0)}$('startBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden');$('status').textContent=stopRequested?'Stopped':'Completed ✓'}
function stopAuto(){stopRequested=true;if('speechSynthesis'in window)speechSynthesis.cancel();$('startBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden');$('status').textContent='Ready'}function startFrom(i){stopAuto();run(i)}
$('startBtn').onclick=()=>run(0);$('stopBtn').onclick=stopAuto;$('prevPage').onclick=()=>{if(page>0){stopAuto();page--;render()}};$('nextPage').onclick=()=>{if(page<Math.ceil(words.length/10)-1){stopAuto();page++;render()}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}
tabs();loadTopic(currentTopic);
</script></body></html>
